<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uh oh...</title>
	<link rel="icon" type="image/x-icon" href="https://khubziba.vercel.app/img/Favicon.png">

    <style>
    /* === BODY === */
    body {
      margin: 0;
      background: #071a33;
      position: relative;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* === STICKY HEADER === */
    .sticky {
      position: sticky;
      top: 0;
      background: linear-gradient(45deg, #399fe3, #107ead, #8246b0);
      padding: 10px;
      font-size: 30px;
      color: white;
      z-index: 10;
    }

    .sticky2 {
      position: sticky;
      bottom: 0;
      background: yellowgreen;
      padding: 5px 10px;
      font-size: 14px;
      color: white;
      text-align: center;
      z-index: 10;
    }

    /* === CENTERED VIDEO === */
    .centered {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .rounded-image {
      border-radius: 10%;
      max-width: 90%;
      height: auto;
    }

    /* === TEXT BELOW VIDEO === */
    .centered2 {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: large;
      margin: 20px 0;
    }

    .centered2 img {
      height: 1.2em;
      margin: 0 5px;
    }

    /* === EMOJIS === */
    .emoji {
      position: absolute;
      top: -50px;
      pointer-events: none;
      font-size: 2rem;
      animation: fall linear infinite;
      z-index: 9999;
    }

    /* CSS animation for falling emojis */
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 2;
      }

      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    .special-btn {
      border-radius: 15%;
    }

    .special-btn:link,
    .special-btn:visited {
      background-color: #f44336;
      color: white;
      padding: 15px 25px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .special-btn:hover {
      background-color: rgba(0, 8, 255, 0.584);
    }

    .special-btn:active {
      background-color: rgba(29, 198, 10, 0.678);
    }

    /* === HEADER CONTENT === */
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-content2 {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    .logo-text {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Gill Sans', 'Gill Sans MT', 'Calibri', 'Trebuchet MS', sans-serif;
    }

    .logo-text img {
      height: 1.5em;
    }

    /* === 404 PAGE === */
    .error {
      max-width: 600px;

      /* Center the 404 content */
      margin: 0 auto;
      text-align: center;

      padding: 40px 20px;
    }

    .error h1 {
      font-size: 120px;
      margin: 0;
      color: white;

    }

    .error h2 {
      font-size: 32px;
	  color: white;
    }

    .error p {
      color: #b8c7dc;
    }

    .home {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .home:hover {
      background: #2196f3;
    }
    </style>
</head>

<body>

    <!-- STICKY HEADER -->
    <div class="sticky">
        <div class="header-content">
            <span class="logo-text">
                <img src="https://khubziba.vercel.app/img/Favicon.png" style="height:1.5em;">
                Khubziba: <span id="thing"></span>??
            </span>
        </div>
    </div>

    <!-- 404 CONTENT -->
    <div class="error">
        <h1>404</h1>

<p id="not-found-text"></p>

    <p>
        May I plead to ask, but what is
        "<span id="url"></span>"?
    </p>
		<p id="suggestion"></p>

    <p>
        <strong>
            We've searched the whole universe.
            Perhaps you typed it incorrectly.
            Perhaps the page vanished.
            But there is no <span id="subject"></span>
            <span id="emoji"></span>.
        </strong>
    </p>

    <p id="error-code"></p>

        <a class="home" href="/">
            Find cooler things on the way back home!
        </a>
    </div>
<script>
    // Get the path WITHOUT the domain
    const path = decodeURIComponent(window.location.pathname);

    // Remove leading/trailing slashes
    const cleanPath = path.replace(/^\/+|\/+$/g, "");

    // Split /Ieat/banana into ["Ieat", "banana"]
    const parts = cleanPath.split("/").filter(Boolean);

    // Make it readable:
    // ["Ieat", "banana"] → "Ieat - banana"
    const displayName = parts.join(" - ");

    // The final part is the main thing we're confused about
    const subject = parts.length
        ? parts[parts.length - 1]
        : "this";

    // Display values
    document.getElementById("thing").textContent = displayName || "this";
	document.getElementById("url").textContent = displayName || "this";
    document.getElementById("subject").textContent = subject;

    document.getElementById("not-found-text").textContent =
        `The page you're looking for—erm—"${displayName || "this"}" doesn't exist!`;

    document.getElementById("error-code").textContent =
        `ERROR_404_${subject.toUpperCase().replace(/[^A-Z0-9]+/g, "-")}-NOT-FOUND`;

    // Emoji dictionary
    const emojis = {
        banana: "🍌",
        apple: "🍎",
        orange: "🍊",
        pizza: "🍕",
        cat: "🐱",
        dog: "🐶",
        bird: "🐦",
        fish: "🐟",
        chess: "♟️",
        queen: "♛",
        king: "♔",
        music: "🎵",
        song: "🎵",
        video: "🎬",
        camera: "📷",
        computer: "💻",
        code: "💻",
        book: "📖",
        books: "📚",
        moon: "🌙",
        sun: "☀️",
        star: "⭐",
        space: "🚀",
        rocket: "🚀",
        earth: "🌍",
        india: "🇮🇳",
        home: "🏠",
        money: "💰",
        game: "🎮",
        games: "🎮",
        fire: "🔥",
        water: "💧",
        flower: "🌸",
        heart: "❤️",
    };
const knownWords = Object.keys(emojis);
    // Try the exact word first
    function levenshtein(a, b) {
        const matrix = [];

        for (let i = 0; i <= b.length; i++) {
            matrix[i] = [i];
        }

        for (let j = 0; j <= a.length; j++) {
            matrix[0][j] = j;
        }

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (
                    b[i - 1].toLowerCase() ===
                    a[j - 1].toLowerCase()
                ) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + 1
                    );
                }
            }
        }

        return matrix[b.length][a.length];
    }

    function similarity(a, b) {
        const distance = levenshtein(a, b);
        const maxLength = Math.max(a.length, b.length);

        if (maxLength === 0) return 100;

        return (1 - distance / maxLength) * 100;
    }

    // Find the closest known word
    let bestMatch = null;
    let bestScore = 0;

    const lowerSubject = subject.toLowerCase();

    for (const word of knownWords) {
        const score = similarity(lowerSubject, word);

        if (score > bestScore) {
            bestScore = score;
            bestMatch = word;
        }
    }

    // Show suggestion only if similarity is 60%+
    const suggestionElement =
        document.getElementById("suggestion");

    if (
        bestMatch &&
        bestScore >= 60 &&
        bestMatch !== lowerSubject
    ) {
        suggestionElement.textContent =
            `Did you mean "${bestMatch}"${emojis[bestMatch] || ""}? ` +
            `Anyways, that doesn't exist either.`;
    } else {
        suggestionElement.textContent = "";
    }
	// Get emoji for the actual subject
let emoji = emojis[subject.toLowerCase()];

if (!emoji) {
    const lowerSubject = subject.toLowerCase();

    for (const word of knownWords) {
        if (lowerSubject.includes(word)) {
            emoji = emojis[word];
            break;
        }
    }
}

if (!emoji) {
    emoji = "";
}

document.getElementById("emoji").textContent = emoji;
</script>
</body>
</html>
